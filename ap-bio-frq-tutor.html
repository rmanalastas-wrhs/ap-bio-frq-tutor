<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AP Biology FRQ Tutor</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    // BACKEND URL: your Apps Script web app
    const BACKEND_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    // AP Biology Units & Topics
    const UNITS_DATA = [
      {
        id: "1",
        name: "Unit 1: Chemistry of Life",
        topics: [
          "1.1 Structure of Water and Hydrogen Bonding",
          "1.2 Elements of Life",
          "1.3 Introduction to Macromolecules",
          "1.4 Carbohydrates",
          "1.5 Lipids",
          "1.6 Nucleic Acids",
          "1.7 Proteins"
        ]
      },
      {
        id: "2",
        name: "Unit 2: Cell Structure and Function",
        topics: [
          "2.1 Cell Structure and Function",
          "2.2 Cell Size",
          "2.3 Plasma Membrane",
          "2.4 Membrane Permeability",
          "2.5 Membrane Transport",
          "2.6 Facilitated Diffusion",
          "2.7 Tonicity and Osmoregulation",
          "2.8 Mechanisms of Transport",
          "2.9 Cell Compartmentalization",
          "2.10 Origins of Cell Compartmentalization"
        ]
      },
      {
        id: "3",
        name: "Unit 3: Cellular Energetics",
        topics: [
          "3.1 Enzymes",
          "3.2 Environmental Impacts on Enzyme Function",
          "3.3 Cellular Energy",
          "3.4 Photosynthesis",
          "3.5 Cellular Respiration"
        ]
      },
      {
        id: "4",
        name: "Unit 4: Cell Communication and Cell Cycle",
        topics: [
          "4.1 Cell Communication",
          "4.2 Introduction to Signal Transduction",
          "4.3 Signal Transduction",
          "4.4 Feedback",
          "4.5 Cell Cycle",
          "4.6 Regulation of Cell Cycle"
        ]
      },
      {
        id: "5",
        name: "Unit 5: Heredity",
        topics: [
          "5.1 Meiosis",
          "5.2 Meiosis and Genetic Diversity",
          "5.3 Mendelian Genetics",
          "5.4 Non-Mendelian Genetics",
          "5.5 Environmental Effects on Phenotype",
          "5.6 Chromosomal Inheritance"
        ]
      },
      {
        id: "6",
        name: "Unit 6: Gene Expression and Regulation",
        topics: [
          "6.1 DNA and RNA Structure",
          "6.2 DNA Replication",
          "6.3 Transcription and RNA Processing",
          "6.4 Translation",
          "6.5 Regulation of Gene Expression",
          "6.6 Gene Expression and Cell Specialization",
          "6.7 Mutations",
          "6.8 Biotechnology"
        ]
      },
      {
        id: "7",
        name: "Unit 7: Natural Selection",
        topics: [
          "7.1 Introduction to Natural Selection",
          "7.2 Natural Selection",
          "7.3 Artificial Selection",
          "7.4 Population Genetics",
          "7.5 Hardy-Weinberg Equilibrium",
          "7.6 Evidence of Evolution",
          "7.7 Common Ancestry",
          "7.8 Continuing Evolution",
          "7.9 Phylogeny",
          "7.10 Speciation",
          "7.11 Variations in Populations",
          "7.12 Origins of Life on Earth"
        ]
      },
      {
        id: "8",
        name: "Unit 8: Ecology",
        topics: [
          "8.1 Responses to the Environment",
          "8.2 Energy Flow Through Ecosystems",
          "8.3 Population Ecology",
          "8.4 Effect of Density on Populations",
          "8.5 Community Ecology",
          "8.6 Biodiversity",
          "8.7 Disruptions to Ecosystems"
        ]
      }
    ];

    // Simple scoring criteria (you can expand later)
    const DEFAULT_SCORING = [
      { point: 1, criteria: "Uses correct AP Biology terminology." },
      { point: 2, criteria: "Addresses all parts of the prompt." },
      { point: 3, criteria: "Explains underlying mechanisms (how/why)." }
    ];

    function App() {
      const [selectedUnitId, setSelectedUnitId] = React.useState("1");
      const [selectedTopic, setSelectedTopic] = React.useState(UNITS_DATA[0].topics[0]);
      const [promptText, setPromptText] = React.useState("");
      const [studentResponse, setStudentResponse] = React.useState("");
      const [feedback, setFeedback] = React.useState(null);
      const [isLoading, setIsLoading] = React.useState(false);
      const [error, setError] = React.useState("");

      const handleUnitChange = (uId) => {
        setSelectedUnitId(uId);
        const unit = UNITS_DATA.find(u => u.id === uId);
        if (unit && unit.topics.length > 0) {
          setSelectedTopic(unit.topics[0]);
        }
      };

      const handleGeneratePrompt = () => {
        const unit = UNITS_DATA.find(u => u.id === selectedUnitId);
        const unitName = unit ? unit.name : "";
        const topicText = selectedTopic || "";
        const prompt = `AP Biology FRQ – ${unitName}, ${topicText}:\n\n` +
          `Write a response that describes the relevant biological processes and explains how they relate to the scenario. ` +
          `Use clear, precise AP Biology terminology and address all parts of the prompt.`;
        setPromptText(prompt);
        setFeedback(null);
        setStudentResponse("");
      };

      const handleSubmit = async () => {
        setError("");
        if (!promptText.trim()) {
          setError("Generate a prompt first.");
          return;
        }
        if (!studentResponse.trim()) {
          setError("Write a response before submitting.");
          return;
        }

        setIsLoading(true);
        setFeedback(null);

        try {
          const body = {
            context: promptText,
            prompts: [{ verb: "Explain", text: "Explain the underlying biological mechanisms." }],
            scoringCriteria: DEFAULT_SCORING,
            studentResponse: studentResponse
          };

          const res = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });

          if (!res.ok) {
            throw new Error("Backend error: " + res.status);
          }

          const data = await res.json();
          setFeedback(data);
        } catch (e) {
          setError("Error contacting the backend. Check the BACKEND_URL and Apps Script deployment.");
        } finally {
          setIsLoading(false);
        }
      };

      const currentUnit = UNITS_DATA.find(u => u.id === selectedUnitId);

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-white border-b border-gray-200 py-4 px-6">
            <div className="max-w-4xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-xl shadow-sm">
                  <i className="fa-solid fa-dna"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg text-gray-900 leading-none">AP Biology FRQ Tutor</h1>
                  <p className="text-xs text-gray-500 mt-1">Practice FRQ responses and get feedback.</p>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
            <div className="bg-white rounded-2xl border border-gray-200 p-6 space-y-4 shadow-sm">
              <h2 className="text-base font-bold text-gray-900">Configure Practice Question</h2>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="text-xs font-bold text-gray-800 block mb-1">Select AP Biology Unit</label>
                  <select
                    value={selectedUnitId}
                    onChange={(e) => handleUnitChange(e.target.value)}
                    className="w-full p-3 bg-white border border-gray-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                  >
                    {UNITS_DATA.map(u => (
                      <option key={u.id} value={u.id}>{u.name}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-xs font-bold text-gray-800 block mb-1">Select Topic</label>
                  <select
                    value={selectedTopic}
                    onChange={(e) => setSelectedTopic(e.target.value)}
                    className="w-full p-3 bg-white border border-gray-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                  >
                    {currentUnit?.topics.map(t => (
                      <option key={t} value={t}>{t}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="flex justify-end">
                <button
                  onClick={handleGeneratePrompt}
                  className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md text-xs flex items-center gap-2"
                >
                  <i className="fa-solid fa-wand-magic-sparkles"></i>
                  Generate FRQ Prompt
                </button>
              </div>

              {promptText && (
                <div className="mt-4 p-4 bg-slate-50 border border-slate-200 rounded-xl">
                  <span className="text-[10px] font-bold uppercase text-slate-500 block mb-1">Generated Prompt</span>
                  <p className="text-xs text-slate-700 whitespace-pre-line">{promptText}</p>
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl border border-gray-200 p-6 space-y-4 shadow-sm">
              <div className="flex items-center justify-between">
                <label className="text-xs font-bold text-gray-800 flex items-center gap-1.5">
                  <i className="fa-solid fa-pen-to-square text-emerald-600"></i>
                  Your Response
                </label>
                <span className="text-[11px] text-gray-400">
                  {studentResponse.trim().split(/\s+/).filter(Boolean).length} words
                </span>
              </div>

              <textarea
                value={studentResponse}
                onChange={(e) => setStudentResponse(e.target.value)}
                placeholder="Write your complete FRQ response here..."
                className="w-full h-32 p-3.5 bg-slate-50 border border-gray-200 rounded-xl text-xs leading-relaxed focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none resize-y"
              ></textarea>

              {error && (
                <p className="text-xs text-rose-600 font-bold">{error}</p>
              )}

              <div className="flex justify-end">
                <button
                  onClick={handleSubmit}
                  disabled={isLoading}
                  className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow text-xs flex items-center gap-1.5 disabled:opacity-50"
                >
                  {isLoading ? (
                    <>
                      <i className="fa-solid fa-spinner animate-spin"></i> Evaluating...
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-paper-plane"></i> Submit for Feedback
                    </>
                  )}
                </button>
              </div>

              {feedback && (
                <div className="mt-4 space-y-3">
                  <div className="flex items-center justify-between border-b pb-2">
                    <span className="text-xs font-bold text-gray-900">Chief Reader Assessment</span>
                    <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                      {feedback.pointsEarned} / {feedback.maxPoints} Points
                    </span>
                  </div>

                  {feedback.socraticHint && (
                    <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 space-y-1">
                      <span className="font-bold block flex items-center gap-1">
                        <i className="fa-solid fa-lightbulb"></i> Guiding Hint:
                      </span>
                      <p>{feedback.socraticHint}</p>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 bg-emerald-50 border border-emerald-100 rounded-xl">
                      <span className="font-bold text-emerald-900 block mb-1">Strengths:</span>
                      <ul className="list-disc list-inside space-y-0.5 text-emerald-800 text-[11px]">
                        {feedback.strengths?.map((s, i) => <li key={i}>{s}</li>)}
                      </ul>
                    </div>
                    <div className="p-3 bg-rose-50 border border-rose-100 rounded-xl">
                      <span className="font-bold text-rose-900 block mb-1">To Refine:</span>
                      <ul className="list-disc list-inside space-y-0.5 text-rose-800 text-[11px]">
                        {feedback.misconceptions?.map((m, i) => <li key={i}>{m}</li>)}
                      </ul>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
