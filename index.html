<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AP Biology FRQ Tutor</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Babel (for JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .btn {
        transition: background-color 0.15s ease-in-out, transform 0.05s ease-in-out;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .disabled-btn {
        background-color: #9ca3af !important;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // ================================
      // BACKEND URL (Apps Script web app)
      // ================================
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwQTHUCZt76Q0TKT8Ii4ByUuozIPKUkomPOGJDwvG4JUrtvPPJ_ctmCvSGpIv4UsnQmZA/exec";

      // ================================
      // AP BIOLOGY UNITS & TOPICS (from your list)
      // ================================
      const UNITS_DATA = {
        "Unit 1 – Chemistry of Life": [
          "1.1 Structure of Water and Hydrogen Bonding",
          "1.2 Elements of Life",
          "1.3 Introduction to Macromolecules",
          "1.4 Carbohydrates",
          "1.5 Lipids",
          "1.6 Nucleic Acids",
          "1.7 Proteins"
        ],
        "Unit 2 – Cells": [
          "2.1 Cell Structure and Function",
          "2.2 Cell Size",
          "2.3 Plasma Membrane",
          "2.4 Membrane Permeability",
          "2.5 Membrane Transport",
          "2.6 Facilitated Diffusion",
          "2.7 Tonicity and Osmoregulation",
          "2.8 Mechanisms of Transport",
          "2.9 Cell Compartmentalization",
          "2.10 Origins of Cell Compartmentalization"
        ],
        "Unit 3 – Cellular Energetics": [
          "3.1 Enzymes",
          "3.2 Environmental Impacts on Enzyme Function",
          "3.3 Cellular Energy",
          "3.4 Photosynthesis",
          "3.5 Cellular Respiration"
        ],
        "Unit 4 – Cell Communication and Cell Cycle": [
          "4.1 Cell Communication",
          "4.2 Introduction to Signal Transduction",
          "4.3 Signal Transduction Pathways",
          "4.4 Feedback",
          "4.5 Cell Cycle",
          "4.6 Regulation of Cell Cycle"
        ],
        "Unit 5 – Heredity": [
          "5.1 Meiosis",
          "5.2 Meiosis and Genetic Diversity",
          "5.3 Mendelian Genetics",
          "5.4 Non-Mendelian Genetics",
          "5.5 Environmental Effects on Phenotype"
        ],
        "Unit 6 – Gene Expression and Regulation": [
          "6.1 DNA and RNA Structure",
          "6.2 DNA Replication",
          "6.3 Transcription and RNA Processing",
          "6.4 Translation",
          "6.5 Regulation of Gene Expression",
          "6.6 Gene Expression and Cell Specialization",
          "6.7 Mutations",
          "6.8 Biotechnology"
        ],
        "Unit 7 – Natural Selection": [
          "7.1 Introduction to Natural Selection",
          "7.2 Natural Selection",
          "7.3 Artificial Selection",
          "7.4 Population Genetics",
          "7.5 Hardy-Weinberg Equilibrium",
          "7.6 Evidence of Evolution",
          "7.7 Common Ancestry",
          "7.8 Continuing Evolution",
          "7.9 Phylogeny",
          "7.10 Speciation",
          "7.11 Variations in Populations",
          "7.12 Origins of Life on Earth"
        ],
        "Unit 8 – Ecology": [
          "8.1 Responses to the Environment",
          "8.2 Energy Flow Through Ecosystems",
          "8.3 Population Ecology",
          "8.4 Effect of Density on Populations",
          "8.5 Community Ecology",
          "8.6 Biodiversity",
          "8.7 Disruptions in Ecosystems"
        ]
      };

      // ================================
      // TASK VERBS + DEFINITIONS
      // ================================
      const TASK_VERBS = [
        "Calculate",
        "Construct/Draw",
        "Describe",
        "Determine",
        "Evaluate",
        "Explain",
        "Identify",
        "Justify",
        "Make a Claim",
        "Predict",
        "Support a Claim"
      ];

      const TASK_VERB_INFO = {
        "Calculate": "Perform mathematical steps to arrive at a final answer, including units.",
        "Construct/Draw": "Create a diagram, graph, or model that accurately represents data or relationships.",
        "Describe": "Provide relevant characteristics or features of a specified topic.",
        "Determine": "Decide or conclude after reasoning, observation, or applying mathematical steps.",
        "Evaluate": "Judge the significance or quality of information, evidence, or a claim.",
        "Explain": "Provide information about how or why a relationship, process, or pattern occurs.",
        "Identify": "Indicate or name a specific feature, result, or example without detailed explanation.",
        "Justify": "Provide evidence and reasoning that support or defend a claim.",
        "Make a Claim": "State a clear assertion based on evidence or biological knowledge.",
        "Predict": "State the expected outcome or effect of a change, based on biological principles.",
        "Support a Claim": "Explain how evidence backs up a previously stated claim."
      };

      // ================================
      // SCORING CRITERIA (1 point per verb)
      // ================================      
    function generateScoringCriteria(verb) {
        const base = {
          "Calculate": "Correct calculation with appropriate setup, steps, and units.",
          "Construct/Draw": "Accurate diagram/graph that correctly represents the relationship or data.",
          "Describe": "Accurate description of relevant features using specific biological terminology.",
          "Determine": "Clear conclusion or decision with appropriate reasoning or interpretation.",
          "Evaluate": "Clear judgment supported by evidence and consideration of strengths/limitations.",
          "Explain": "Clear explanation of how/why, with logical cause-and-effect reasoning.",
          "Identify": "Correct identification of the requested feature/result/example.",
          "Justify": "Clear claim supported by specific evidence and logical reasoning.",
          "Make a Claim": "Clear, testable assertion that is biologically plausible and relevant.",
          "Predict": "Correct prediction of outcome with brief justification based on biological principles.",
          "Support a Claim": "Specific evidence clearly linked to the claim with correct reasoning."
        };

        return [{
          verb,
          criteria: base[verb] || base["Explain"],
          points: 1
        }];
      }

      // ================================
      // MAIN APP COMPONENT
      // ================================
      function App() {
        const [studentName, setStudentName] = useState("");
        const [selectedUnit, setSelectedUnit] = useState("");
        const [selectedTopic, setSelectedTopic] = useState("");
        const [selectedVerbs, setSelectedVerbs] = useState([]);
        const [generatedPrompt, setGeneratedPrompt] = useState("");
        const [studentResponse, setStudentResponse] = useState("");
        const [feedback, setFeedback] = useState(null);
        const [loading, setLoading] = useState(false);
        const [promptGenerated, setPromptGenerated] = useState(false);

        const topics = selectedUnit ? UNITS_DATA[selectedUnit] : [];
        const wordCount = studentResponse.trim() ? studentResponse.trim().split(/\s+/).length : 0;

        function toggleVerb(verb) {
          setSelectedVerbs(prev => {
            if (prev.includes(verb)) {
              return prev.filter(v => v !== verb);
            } else {
              return [...prev, verb];
            }
          });
        }

        async function generatePrompt() {
          if (!selectedUnit || !selectedTopic || selectedVerbs.length === 0) return;

          setLoading(true);
          setGeneratedPrompt("");
          setStudentResponse("");
          setFeedback(null);
          setPromptGenerated(false);

          const context = `${selectedUnit} - ${selectedTopic}`;

          try {
            const res = await fetch(BACKEND_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mode: "generatePrompt",
                context,
                verbs: selectedVerbs
              })
            });

            const data = await res.json();
            if (data.error) {
              throw new Error(data.error);
            }

            setGeneratedPrompt(data.promptText || "No prompt generated.");
            setPromptGenerated(true);
          } catch (err) {
            alert("Error generating prompt: " + err.message);
          } finally {
            setLoading(false);
          }
        }

        function resetTutor() {
          setGeneratedPrompt("");
          setStudentResponse("");
          setFeedback(null);
          setPromptGenerated(false);
        }

        function printLog() {
          const logHtml = `
            <html>
              <head>
                <title>AP Bio FRQ Practice Log</title>
                <style>
                  body { font-family: Arial, sans-serif; padding: 24px; }
                  h1 { font-size: 18px; margin: 0 0 4px; }
                  h2 { font-size: 16px; margin-top: 18px; margin-bottom: 6px; }
                  p { font-size: 14px; margin: 4px 0 10px; }
                  ul { margin: 4px 0 10px 18px; }
                  li { font-size: 14px; margin: 2px 0; }
                  .section { margin-bottom: 16px; }
                  .label { font-weight: bold; }
                </style>
              </head>
              <body>
                <h1>AP Biology FRQ Practice Log</h1>
                <div class="section">
                  <p><span class="label">Student:</span> ${studentName || "(not provided)"}</p>
                  <p><span class="label">Date/Time:</span> ${new Date().toLocaleString()}</p>
                </div>

                <div class="section">
                  <h2>Practice Details</h2>
                  <p><span class="label">Unit:</span> ${selectedUnit}</p>
                  <p><span class="label">Topic:</span> ${selectedTopic}</p>
                  <p><span class="label">Task Verbs:</span> ${selectedVerbs.join(", ")}</p>
                </div>

                <div class="section">
                  <h2>FRQ Prompt</h2>
                  <p>${generatedPrompt || "(no prompt generated)"}</p>
                </div>

                <div class="section">
                  <h2>Student Response</h2>
                  <p>${studentResponse || "(no response)"}</p>
                </div>

                <div class="section">
                  <h2>Feedback</h2>
                  <p><span class="label">Points:</span> ${feedback.pointsEarned} / ${feedback.maxPoints}</p>

                  <p><span class="label">Strengths:</span></p>
                  <ul>
                    ${(feedback.strengths || []).map(s => `<li>${s}</li>`).join("")}
                  </ul>

                  <p><span class="label">Misconceptions / Areas to Improve:</span></p>
                  <ul>
                    ${(feedback.misconceptions || []).map(m => `<li>${m}</li>`).join("")}
                  </ul>

                  <p><span class="label">Hint for Revision:</span> ${feedback.socraticHint || ""}</p>
                </div>
              </body>
            </html>
          `;

          const printWindow = window.open("", "_blank");
          if (!printWindow) {
            alert("Please allow pop-ups to print/save your log.");
            return;
          }
          printWindow.document.write(logHtml);
          printWindow.document.close();
          printWindow.focus();
          setTimeout(() => {
            printWindow.print();
          }, 250);
        }

        async function submitForFeedback() {
          if (!studentResponse.trim() || !generatedPrompt || selectedVerbs.length === 0) {
            alert("Please write a response before submitting.");
            return;
          }

          setLoading(true);
          setFeedback(null);

          const allCriteria = selectedVerbs.flatMap(verb =>
            generateScoringCriteria(verb)
          );

          const context = `${selectedUnit} - ${selectedTopic}`;

          try {
            const res = await fetch(BACKEND_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mode: "evaluateResponse",
                context,
                verbs: selectedVerbs,
                promptText: generatedPrompt,
                scoringCriteria: allCriteria,
                studentResponse: studentResponse.trim()
              })
            });

            const data = await res.json();
            if (data.error) {
              throw new Error(data.error);
            }
            setFeedback(data);
          } catch (err) {
            alert("Error getting feedback: " + err.message);
          } finally {
            setLoading(false);
          }
        }

        return (
          <div className="min-h-screen bg-slate-50 p-4">
            <div className="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
              <h1 className="text-2xl font-bold text-slate-800 mb-4">
                AP Biology FRQ Tutor
              </h1>

              {/* Student Name */}
              <div className="mb-4">
                <label className="block text-sm font-semibold text-slate-700 mb-1">
                  Your Name (optional)
                </label>
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  placeholder="Your name (optional)"
                  className="w-full p-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              {/* Unit Select */}
              <div className="mb-4">
                <label className="block text-sm font-semibold text-slate-700 mb-1">
                  Unit
                </label>
                <select
                  value={selectedUnit}
                  onChange={(e) => {
                    setSelectedUnit(e.target.value);
                    setSelectedTopic("");
                  }}
                  className="w-full p-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="">Select a unit</option>
                  {Object.keys(UNITS_DATA).map(unit => (
                    <option key={unit} value={unit}>{unit}</option>
                  ))}
                </select>
              </div>

              {/* Topic Select */}
              <div className="mb-4">
                <label className="block text-sm font-semibold text-slate-700 mb-1">
                  Topic
                </label>
                <select
                  value={selectedTopic}
                  onChange={(e) => setSelectedTopic(e.target.value)}
                  disabled={!selectedUnit}
                  className="w-full p-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100"
                >
                  <option value="">Select a topic</option>
                  {topics.map(topic => (
                    <option key={topic} value={topic}>{topic}</option>
                  ))}
                </select>
              </div>

              {/* Task Verbs (checkboxes) */}
              <div className="mb-4">
                <label className="block text-sm font-semibold text-slate-700 mb-2">
                  Task Verbs (select one or more)
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {TASK_VERBS.map(verb => {
                    const isChecked = selectedVerbs.includes(verb);
                    return (
                      <label key={verb} className="flex items-center gap-2 text-sm text-slate-800">
                        <input
                          type="checkbox"
                          checked={isChecked}
                          onChange={() => toggleVerb(verb)}
                          className="h-4 w-4"
                        />
                        <span>{verb}</span>
                      </label>
                    );
                  })}
                </div>
              </div>

              {/* Task Verb Definitions */}
              {selectedVerbs.length > 0 && (
                <div className="mb-4 p-3 bg-blue-50 border border-blue-200 rounded">
                  <span className="text-[10px] font-bold uppercase text-blue-700 block mb-1">
                    Task Verb Help
                  </span>
                  <div className="space-y-2">
                    {selectedVerbs.map(verb => (
                      <div key={verb}>
                        <span className="text-xs font-bold text-blue-900">{verb}: </span>
                        <span className="text-xs text-blue-900">{TASK_VERB_INFO[verb]}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Generate + Reset + Print buttons */}
              <div className="flex flex-wrap gap-2 mb-4">
                <button
                  onClick={generatePrompt}
                  disabled={!selectedUnit || !selectedTopic || selectedVerbs.length === 0 || loading}
                  className="btn px-4 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                  {loading && !promptGenerated ? "Generating..." : "Generate New FRQ"}
                </button>

                <button
                  onClick={resetTutor}
                  className="btn px-4 py-2 text-sm font-semibold bg-gray-200 hover:bg-gray-300 text-gray-800 rounded"
                >
                  Reset
                </button>

                <button
                  onClick={printLog}
                  disabled={!feedback}
                  className="btn px-4 py-2 text-sm font-semibold bg-green-600 hover:bg-green-700 text-white rounded disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                  Print / Save My Log
                </button>
              </div>

              {/* Prompt Area */}
              {promptGenerated && (
                <div className="mb-4">
                  <label className="block text-sm font-semibold text-slate-700 mb-1">
                    FRQ Prompt
                  </label>
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded text-sm text-slate-800">
                    {generatedPrompt}
                  </div>
                </div>
              )}

              {/* Response Area */}
              {promptGenerated && (
                <div className="mb-4">
                  <label className="block text-sm font-semibold text-slate-700 mb-1">
                    Your Response
                  </label>
                  <textarea
                    value={studentResponse}
                    onChange={(e) => setStudentResponse(e.target.value)}
                    placeholder="Write your FRQ response here..."
                    rows={6}
                    className="w-full p-3 text-sm border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <div className="text-right text-xs text-slate-500 mt-1">
                    Word count: {wordCount}
                  </div>
                </div>
              )}

              {/* Submit Button */}
              {promptGenerated && (
                <button
                  onClick={submitForFeedback}
                  disabled={loading || !studentResponse.trim()}
                  className="btn w-full mb-4 px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                  {loading ? "Getting Feedback..." : "Submit for Feedback"}
                </button>
              )}

              {/* Feedback Area */}
              {feedback && (
                <div className="mt-6 p-4 bg-green-50 border border-green-200 rounded">
                  <h2 className="text-lg font-bold text-green-800 mb-2">
                    Feedback
                  </h2>

                  <div className="mb-3">
                    <span className="text-sm font-semibold text-green-900">
                      Points: {feedback.pointsEarned} / {feedback.maxPoints}
                    </span>
                  </div>

                  <div className="mb-3">
                    <h3 className="text-sm font-bold text-green-900 mb-1">Strengths</h3>
                    <ul className="list-disc list-inside text-sm text-green-900">
                      {feedback.strengths && feedback.strengths.length > 0 ? (
                        feedback.strengths.map((s, i) => (
                          <li key={i}>{s}</li>
                        ))
                      ) : (
                        <li>No specific strengths identified.</li>
                      )}
                    </ul>
                  </div>

                  <div className="mb-3">
                    <h3 className="text-sm font-bold text-green-900 mb-1">Misconceptions / Areas to Improve</h3>
                    <ul className="list-disc list-inside text-sm text-green-900">
                      {feedback.misconceptions && feedback.misconceptions.length > 0 ? (
                        feedback.misconceptions.map((m, i) => (
                          <li key={i}>{m}</li>
                        ))
                      ) : (
                        <li>No major misconceptions detected.</li>
                      )}
                    </ul>
                  </div>

                  <div>
                    <h3 className="text-sm font-bold text-green-900 mb-1">Hint for Revision</h3>
                    <p className="text-sm text-green-900 italic">
                      {feedback.socraticHint || "No hint provided."}
                    </p>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
